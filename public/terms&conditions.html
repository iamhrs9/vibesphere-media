<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms & Conditions - VibeSphere Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl text-gray-800">
        <h1 class="text-3xl font-bold mb-6 underline">Terms & Conditions</h1>

        <div id="legalContent" class="mb-6 prose max-w-none">
            <p>Loading...</p>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                fetch('/api/legal/terms')
                    .then(res => res.json())
                    .then(data => {
                        const container = document.getElementById('legalContent');
                        if (data.success && data.content) {
                            container.innerHTML = data.content;
                        } else {
                            container.innerHTML = '<p>Content not found.</p>';
                        }
                    })
                    .catch(() => {
                        document.getElementById('legalContent').innerHTML = '<p>Failed to load content.</p>';
                    });
            });
        </script>

        <div class="mt-10 pt-4 border-t border-gray-200">
            <a href="/index.html" class="text-blue-600 hover:underline">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
