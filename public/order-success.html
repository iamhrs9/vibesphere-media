<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully! 🎉 | VibeSphere Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #f5f3ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(108, 99, 255, 0.12);
            text-align: center;
            width: 90%;
            max-width: 480px;
            transform: translateY(20px);
            opacity: 0;
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardAppear {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 3rem;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5); }
            100% { transform: scale(1); box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3); }
        }

        h1 {
            color: #1e293b;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
        }

        p {
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }

        .order-info {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(108, 99, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .info-row:last-child {
            margin-bottom: 0;
            border-top: 1px dashed rgba(108, 99, 255, 0.15);
            padding-top: 8px;
        }

        .label { color: #64748b; font-weight: 500; }
        .value { color: #1e293b; font-weight: 700; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #4f46e5);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.25);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(108, 99, 255, 0.35);
        }

        .btn-secondary {
            background: white;
            color: #4f46e5;
            border: 1px solid rgba(108, 99, 255, 0.2);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(108, 99, 255, 0.04);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            <i class="ri-checkbox-circle-fill"></i>
        </div>
        <h1>Order Placed!</h1>
        <p>Your payment has been successfully processed, and your order is officially registered.</p>

        <div class="order-info">
            <div class="info-row" id="orderIdRow" style="display: none;">
                <span class="label">Reference Number</span>
                <span class="value" id="infoOrderId" style="font-weight: 800; color: #6c63ff;"></span>
            </div>
            <div class="info-row">
                <span class="label">Product/Package</span>
                <span class="value" id="infoPackage">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Payment Mode</span>
                <span class="value" id="infoMethod" style="color: #6c63ff;"><i class="ri-wallet-3-line"></i> VibeSphere Wallet</span>
            </div>
            <div class="info-row">
                <span class="label">Amount Paid</span>
                <span class="value" id="infoAmount" style="font-size: 1.1rem; color: #10b981;">Loading...</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="/dashboard.html?tab=orders" class="btn-primary">
                <i class="ri-dashboard-line"></i> Go to My Dashboard
            </a>
            <a href="/" class="btn-secondary">
                Back to Homepage
            </a>
        </div>
    </div>

    <!-- Load canvas-confetti from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Parse Query Params
        const params = new URLSearchParams(window.location.search);
        const pkgName = params.get('package') || 'VibeSphere Package';
        const amt = params.get('amount') || '₹0';
        const method = params.get('method') || 'wallet';
        const orderId = params.get('orderId') || params.get('order_id') || params.get('id');

        document.getElementById('infoPackage').innerText = pkgName;
        document.getElementById('infoAmount').innerText = amt;
        
        if (orderId && orderId !== 'null' && orderId !== 'undefined') {
            document.getElementById('infoOrderId').innerText = orderId;
            document.getElementById('orderIdRow').style.display = 'flex';
        }

        if (method === 'razorpay') {
            document.getElementById('infoMethod').innerHTML = `<i class="ri-secure-payment-line"></i> Razorpay Gateway`;
            document.getElementById('infoMethod').style.color = '#1e293b';
        }

        // Trigger Confetti Explosion
        window.addEventListener('DOMContentLoaded', () => {
            // Confetti source: basic explosion
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });

            // Fire multiple bursts
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
            }, 250);

            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 400);
        });
    </script>
</body>
</html>
